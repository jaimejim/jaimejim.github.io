<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .ax{stroke:#3a4170;stroke-width:1.5;fill:none}
      .lab{fill:#9aa3d6;font-size:12px}
      .ttl{fill:#e8ebff;font-size:14px;font-weight:700}
      .att{fill:none;stroke:#e8ebff;stroke-width:2.5;stroke-linejoin:round}
      .tick{stroke-width:2.5}
    </style>
  </defs>
  <rect width="900" height="420" rx="14" fill="#0f1226"/>

  <!-- top panel: three chat windows -->
  <text x="60" y="44" class="ttl">Three agent windows</text>
  <path class="ax" d="M60 170 H840"/>
  <path class="ax" d="M60 60 V170"/>
  <text x="845" y="174" class="lab">time</text>
  <text x="40" y="118" class="lab" transform="rotate(-90 40 118)" text-anchor="middle">attention</text>
  <!-- sawtooth: attention climbs, every interrupt drops it back, never reaching the top -->
  <path class="att" d="M60 165 L170 110 L170 160 L250 118 L250 158 L370 96 L370 160 L430 128 L430 158 L560 92 L560 160 L640 120 L640 158 L740 104 L740 160 L840 112"/>
  <!-- interrupt ticks, coloured per agent -->
  <g class="tick">
    <line x1="170" y1="60" x2="170" y2="170" stroke="#f9a8d4"/>
    <line x1="250" y1="60" x2="250" y2="170" stroke="#fde047"/>
    <line x1="370" y1="60" x2="370" y2="170" stroke="#86efac"/>
    <line x1="430" y1="60" x2="430" y2="170" stroke="#f9a8d4"/>
    <line x1="560" y1="60" x2="560" y2="170" stroke="#fde047"/>
    <line x1="640" y1="60" x2="640" y2="170" stroke="#86efac"/>
    <line x1="740" y1="60" x2="740" y2="170" stroke="#f9a8d4"/>
  </g>
  <text x="176" y="72" class="lab" fill="#f9a8d4">done?</text>
  <text x="256" y="72" class="lab" fill="#fde047">which file?</text>
  <text x="376" y="72" class="lab" fill="#86efac">approve?</text>
  <text x="566" y="72" class="lab" fill="#fde047">done?</text>
  <text x="746" y="72" class="lab" fill="#f9a8d4">next?</text>

  <!-- bottom panel: one buffer -->
  <text x="60" y="244" class="ttl">One shared buffer</text>
  <path class="ax" d="M60 370 H840"/>
  <path class="ax" d="M60 260 V370"/>
  <text x="845" y="374" class="lab">time</text>
  <text x="40" y="318" class="lab" transform="rotate(-90 40 318)" text-anchor="middle">attention</text>
  <!-- attention climbs once and stays; agent edits land as marks on the line -->
  <path class="att" d="M60 365 L200 300 L840 272"/>
  <g>
    <circle cx="230" cy="298.7" r="5" fill="#f9a8d4"/>
    <circle cx="310" cy="295.2" r="5" fill="#fde047"/>
    <circle cx="420" cy="290.4" r="5" fill="#86efac"/>
    <circle cx="470" cy="288.2" r="5" fill="#f9a8d4"/>
    <circle cx="600" cy="282.5" r="5" fill="#fde047"/>
    <circle cx="680" cy="279" r="5" fill="#86efac"/>
    <circle cx="780" cy="274.6" r="5" fill="#f9a8d4"/>
  </g>
  <text x="600" y="340" class="lab">agent edits land in the text, the author keeps writing</text>
</svg>
