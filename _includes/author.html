<section class="author{% if site.disqus == false %} no-disqus{% endif %}">
    <div class="toleft">
        <img
            class="selfie"
            src="{% if site.authors[page.author].external-image == true %}{{ site.authors[page.author].picture }}{% else %}{{ site.url }}/{{ site.authors[page.author].picture }}{% endif %}"
            alt="{{ site.authors[page.author].name }}"
        />
    </div>

    <div class="toright">
        <h4 class="name">{{ site.authors[page.author].name }}</h4>
        <p class="bio">{{ site.authors[page.author].bio }}</p>

        <div class="share">
            <!-- Note: Only use three share links if your site width is set to large -->
            <!-- If site width is set to normal, you may choose any two share links -->
            <a
                class="twitter"
                href="https://twitter.com/intent/tweet?text={{ site.url }}{{ page.url }} - {{ page.title }} by @{{ site.authors[page.author].twitter }}"
            >
                <svg width="14" height="14" viewBox="0 0 512 512" fill="currentColor"><path d="M459.4 151.7c.3 4.6.3 9.1.3 13.7 0 138.7-105.6 298.6-298.6 298.6A296.4 296.4 0 0 1 0 417.6a217 217 0 0 0 25.3 1.3c49 0 94.3-16.6 130.3-44.8-46.1-.9-84.8-31.2-98.1-72.8a105 105 0 0 0 47.4-1.8c-48-9.7-84.1-52-84.1-103v-1.3a104.6 104.6 0 0 0 47.4 13.1A104.9 104.9 0 0 1 35.7 67.2a297.6 297.6 0 0 0 215.9 109.5 104.9 104.9 0 0 1 178.7-95.5c23.4-4.6 45.5-13.1 65.3-24.9a104.7 104.7 0 0 1-46.1 57.8c20.8-2.4 40.8-8 59.3-16.2a213 213 0 0 1-52.4 54.8z"/></svg>
                <span class="icon-twitter">Tweet</span>
            </a>

            <a
                class="facebook"
                href="javascript:void(0)"
                onclick="window.open('https://facebook.com/sharer/sharer.php?u='+encodeURIComponent(location.href), 'facebook-share-dialog', 'width=626,height=436'); return false;"
            >
                <svg width="14" height="14" viewBox="0 0 512 512" fill="currentColor"><path d="M512 256C512 114.6 397.4 0 256 0S0 114.6 0 256c0 120 82.7 220.8 194.2 248.5V334.2h-56.6v-78.2h56.6v-61.3c0-56 33.4-86.9 84.4-86.9 24.4 0 50 4.4 50 4.4v55h-28.2c-27.8 0-36.4 17.2-36.4 34.9v42h61.8l-9.9 78.2h-52v170.3C429.3 476.8 512 376 512 256z"/></svg>
                <span class="icon-facebook-rect">Share</span>
            </a>

            <!-- <a class="linkedin" href="https://www.linkedin.com/shareArticle?mini=true&amp;url={{ site.url }}{{ page.url }}&amp;title={{ page.title }}&amp;summary={{ page.description }}&amp;source={{ site.url }}" target="_blank">
                <i class="fa-brands fa-linkedin"></i>
                <span class="icon-linkedin">Share</span>
            </a> -->
        </div>
    </div>
</section>
