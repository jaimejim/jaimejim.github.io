---
layout: page
title: Tags
---

<h1>Tags</h1>

{% for tag in site.tags %}
<h3 id="{{ tag[0] | slugify }}">#{{ tag[0] }}</h3>
<ul class="entries">
    {% for post in tag[1] reversed %}
        {% if post.title %}
        <li>
            <span class="d">{{ post.date | date: "%Y-%m-%d" }}</span>
            <div>
                <h4 class="t"><a href="{{ site.url }}{{ post.url }}">{{ post.title }}</a></h4>
            </div>
        </li>
        {% endif %}
    {% endfor %}
</ul>
{% endfor %}
